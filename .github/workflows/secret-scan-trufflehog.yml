# Vanilla TruffleHog action (https://github.com/trufflesecurity/trufflehog#octocat-trufflehog-github-action).
# --results=verified,unknown: candidates are checked against provider APIs; only live or
# unverifiable secrets are reported and fail the job.
name: secret-scan-trufflehog

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          version: 3.97.4
          extra_args: --results=verified,unknown
