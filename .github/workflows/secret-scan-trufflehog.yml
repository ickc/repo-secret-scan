# Vanilla TruffleHog action (https://github.com/trufflesecurity/trufflehog#octocat-trufflehog-github-action).
# --results=verified,unknown: candidates are checked against provider APIs; only live or
# unverifiable secrets are reported and fail the job.
# --exclude-detectors=FTP: an earlier commit of this repository contains placeholder FTP URLs
# (test fixtures and docs for the placeholder triage). Their hosts don't resolve, so they come
# back "unknown" and fail every full-history scan; history can't be changed (#8). FTP URLs are
# still covered by the repo-secret-scan workflow, which runs trufflehog with triage.
name: secret-scan-trufflehog

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          version: 3.97.4
          extra_args: --results=verified,unknown --exclude-detectors=FTP
