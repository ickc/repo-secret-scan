[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-secret-scan"
version = "0.1.0"
description = "Pluggable secret-scanning pipeline for a single git repository or a whole GitHub organisation"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
keywords = ["secrets", "gitleaks", "trufflehog", "security", "github"]
dependencies = [
    "typer>=0.9",
]

[project.optional-dependencies]
dashboard = ["plotly>=6.0"]

[project.scripts]
repo-secret-scan = "repo_secret_scan.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/repo_secret_scan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
