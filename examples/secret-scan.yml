# Example workflow for a single repository: copy to .github/workflows/secret-scan.yml.
# Scans the commits introduced by each push / pull request, and the full history weekly.
name: secret-scan

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # only needed for the SARIF upload

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history is needed for range and full scans

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repo-secret-scan
        # Point this at wherever the package is published, e.g. "repo-secret-scan @ git+https://github.com/<owner>/<repo>".
        run: |
          pip install repo-secret-scan
          repo-secret-scan tools install

      - name: Choose scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "args=--scope range --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "args=--scope range --base ${{ github.event.before }} --head ${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "args=--scope history" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan
        run: repo-secret-scan scan . ${{ steps.scope.outputs.args }} --out secret-scan --fail-on high

      - name: Job summary
        if: always()
        run: cat secret-scan/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload SARIF
        if: always() && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: secret-scan/results.sarif
          category: secret-scan
